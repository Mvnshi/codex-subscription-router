name: Upstream canary

# The official ChatGPT/Codex app ships a new build about every day. This installs the newest
# one on a clean runner, runs the project's real installer against it, and, on Windows, boots
# the patched app. It answers one question every day: does the router still work on the
# newest official build? A failure is the earliest warning that an upstream change needs a
# reviewed patch update (see docs/MAINTAINING.md). It never publishes anything.
#
# Runs daily, on demand, for pushes to canary/** branches (to try a change to this file), and
# for pull requests that touch the patchers, the installers or what they build.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    branches: ["canary/**"]
  pull_request:
    paths:
      - ".github/workflows/upstream-canary.yml"
      - "scripts/patch_app*.py"
      - "scripts/win/**"
      - "scripts/canary.py"
      - "scripts/boot-check.ps1"
      - "install.ps1"
      - "install.sh"
      - "ui/**"
      - "cmd/**"
      - "internal/**"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: upstream-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          package-manager-cache: false

      - name: Install the newest official ChatGPT build
        run: |
          curl -fsSL https://persistent.oaistatic.com/codex-app-prod/appcast.xml -o appcast.xml
          url="$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import upstream_watch as w; print(w.parse_appcast(open('appcast.xml', encoding='utf-8').read())[0].url)")"
          echo "Downloading ${url}"
          curl -fsSL "${url}" -o chatgpt.zip
          mkdir official
          ditto -x -k chatgpt.zip official
          sudo ditto official/ChatGPT.app /Applications/ChatGPT.app
          rm -rf chatgpt.zip official
          plutil -p /Applications/ChatGPT.app/Contents/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion"

      # The real installer, as a person would run it, with every question answered yes.
      - name: Run the installer
        id: install
        env:
          CODEX_SUBSCRIPTION_ROUTER_ASSUME_YES: "1"
          CODEX_SUBSCRIPTION_ROUTER_ALLOW_UNTESTED_SOURCE: "1"
          CODEX_SUBSCRIPTION_ROUTER_ALLOW_ADHOC_SIGNING: "1"
          CODEX_SUBSCRIPTION_ROUTER_NO_LAUNCH: "1"
        run: |
          set +e
          bash install.sh 2>&1 | tee install.log
          echo "exit_code=${PIPESTATUS[0]}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Check the signature and boot the patched app
        id: boot
        if: steps.install.outputs.exit_code == '0'
        run: |
          set +e
          app="${HOME}/Applications/Codex Subscription Router.app"
          detail=""
          status=failed
          if ! codesign --verify --deep --strict "${app}" 2>codesign.err; then
            detail="the signature does not verify: $(head -n 1 codesign.err)"
          else
            export CODEX_MUX_UI_TESTS=1
            "${app}/Contents/MacOS/CodexSubscriptionRouterLauncher" >launch.log 2>&1 &
            token="$(cat "${HOME}/.codex-mux/control-token" 2>/dev/null)"
            for _ in $(seq 1 60); do
              if curl -fsS -m 3 -H "X-Codex-Mux-Token: ${token}" http://127.0.0.1:48123/v1/health >/dev/null 2>&1; then
                status=ok
                break
              fi
              sleep 2
            done
            if [ "${status}" = ok ]; then
              detail="signature valid; control API healthy"
              page="$(curl -fsS -m 60 -H "X-Codex-Mux-Token: ${token}" "http://127.0.0.1:48124/v1/test/app-state?debug=1" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('debug',{}).get('readyState','') + ' ' + d.get('debug',{}).get('href',''))" 2>/dev/null)"
              case "${page}" in
                "complete app://"*) detail="${detail}; window loaded" ;;
                *) status=failed; detail="the control API answered but the app's window did not load (${page:-no answer from the bridge})" ;;
              esac
            else
              detail="the control API did not answer within two minutes: $(tail -n 3 launch.log | tr '\n' ' ')"
            fi
            pkill -f "Codex Subscription Router" 2>/dev/null
          fi
          echo "boot: ${status} (${detail})"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "detail=${detail}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Write the result
        if: always()
        env:
          EXIT_CODE: ${{ steps.install.outputs.exit_code }}
          BOOT: ${{ steps.boot.outputs.status }}
          BOOT_DETAIL: ${{ steps.boot.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/canary.py result --platform macos --log install.log --exit-code "${EXIT_CODE:-1}" \
            --boot "${BOOT:-skipped}" --boot-detail "${BOOT_DETAIL}" --run-url "${RUN_URL}" --out canary-macos.json

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-macos
          path: |
            canary-macos.json
            install.log

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CODEX_SUBSCRIPTION_ROUTER_ASSUME_YES: "1"
      CODEX_SUBSCRIPTION_ROUTER_ALLOW_UNTESTED_SOURCE: "1"
      CODEX_SUBSCRIPTION_ROUTER_NO_LAUNCH: "1"
      # A hosted runner is an administrator with nobody else to install for.
      CODEX_SUBSCRIPTION_ROUTER_ALLOW_ELEVATED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          package-manager-cache: false

      - name: Install the newest official Codex build from the Microsoft Store
        shell: pwsh
        run: |
          winget install --id 9PLM9XGG6VKS --source msstore --accept-package-agreements --accept-source-agreements --silent | Out-Null
          $package = Get-AppxPackage -Name OpenAI.Codex | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $package) { throw 'the Store package did not install' }
          "Installed OpenAI.Codex $($package.Version) ($($package.Architecture))"
          "CANARY_PACKAGE=$($package.Version)" >> $env:GITHUB_ENV
          "CANARY_PACKAGE_DIR=$($package.InstallLocation)" >> $env:GITHUB_ENV

      - name: Read the app's own version and build number
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          $work = Join-Path $env:RUNNER_TEMP 'asar-probe'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Push-Location $work
          node "$env:GITHUB_WORKSPACE/node_modules/@electron/asar/bin/asar.mjs" extract-file (Join-Path $env:CANARY_PACKAGE_DIR 'app\resources\app.asar') package.json
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          Pop-Location
          "The app reports version $($manifest.version), build $($manifest.codexBuildNumber)"
          "CANARY_APP_VERSION=$($manifest.version)" >> $env:GITHUB_ENV
          "CANARY_APP_BUILD=$($manifest.codexBuildNumber)" >> $env:GITHUB_ENV

      # The real installer, from Windows PowerShell 5.1 as most people run it.
      - name: Run the installer
        id: install
        shell: bash
        run: |
          set +e
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 > install.log 2>&1
          code=$?
          cat install.log
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Check the shortcuts and icons
        if: steps.install.outputs.exit_code == '0'
        shell: pwsh
        run: |
          $start = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Codex Router.lnk'
          $install = Join-Path $env:LOCALAPPDATA 'Programs\Codex Subscription Router'
          foreach ($path in $start, (Join-Path $install 'Codex Router.ico'), (Join-Path $install 'resources\chatgpt-app-dark.ico')) {
            if (-not (Test-Path -LiteralPath $path)) { throw "missing $path" }
          }
          $a = (Get-FileHash (Join-Path $install 'resources\chatgpt-app-dark.ico')).Hash
          $b = (Get-FileHash (Join-Path $env:GITHUB_WORKSPACE 'assets\windows\codex-router.ico')).Hash
          if ($a -ne $b) { throw 'the window icon is not the router icon' }
          'shortcut and router icons are in place'

      - name: Boot the patched app
        id: boot
        if: steps.install.outputs.exit_code == '0'
        shell: pwsh
        run: |
          $output = & ./scripts/boot-check.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          $output
          $line = ($output -split "`r?`n" | Where-Object { $_ -match '^boot:' } | Select-Object -Last 1)
          $detail = if ($line -match '\((.*)\)') { $Matches[1] } else { $line }
          "status=$(if ($code -eq 0) { 'ok' } else { 'failed' })" >> $env:GITHUB_OUTPUT
          "detail=$detail" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Write the result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.install.outputs.exit_code }}
          BOOT: ${{ steps.boot.outputs.status }}
          BOOT_DETAIL: ${{ steps.boot.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/canary.py result --platform windows-x64 --log install.log --exit-code "${EXIT_CODE:-1}" \
            --boot "${BOOT:-skipped}" --boot-detail "${BOOT_DETAIL}" --package "${CANARY_PACKAGE}" \
            --app-version "${CANARY_APP_VERSION}" --build "${CANARY_APP_BUILD}" --run-url "${RUN_URL}" --out canary-windows-x64.json

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-windows-x64
          path: |
            canary-windows-x64.json
            install.log

  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      CODEX_SUBSCRIPTION_ROUTER_ASSUME_YES: "1"
      CODEX_SUBSCRIPTION_ROUTER_ALLOW_UNTESTED_SOURCE: "1"
      CODEX_SUBSCRIPTION_ROUTER_NO_LAUNCH: "1"
      CODEX_SUBSCRIPTION_ROUTER_ALLOW_ELEVATED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          package-manager-cache: false

      # The ARM64 image has no winget; the installer's own offer to install Python needs it too.
      - name: Get winget onto the ARM64 image
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $directory = Join-Path $env:RUNNER_TEMP 'winget'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          Invoke-WebRequest https://aka.ms/getwinget -OutFile "$directory\AppInstaller.msixbundle"
          Invoke-WebRequest https://aka.ms/Microsoft.VCLibs.arm64.14.00.Desktop.appx -OutFile "$directory\vclibs.appx"
          Invoke-WebRequest https://github.com/microsoft/microsoft-ui-xaml/releases/download/v2.8.6/Microsoft.UI.Xaml.2.8.arm64.appx -OutFile "$directory\xaml.appx"
          # A newer copy of a dependency being present is fine; only the bundle has to install.
          foreach ($dependency in 'vclibs.appx', 'xaml.appx') {
            try { Add-AppxPackage -Path "$directory\$dependency" } catch { "$dependency : $($_.Exception.Message)" }
          }
          Add-AppxPackage -Path "$directory\AppInstaller.msixbundle"
          "$env:LOCALAPPDATA\Microsoft\WindowsApps" >> $env:GITHUB_PATH
          winget --version

      - name: Install the newest official Codex build from the Microsoft Store
        shell: pwsh
        run: |
          winget install --id 9PLM9XGG6VKS --source msstore --accept-package-agreements --accept-source-agreements --silent | Out-Null
          $package = Get-AppxPackage -Name OpenAI.Codex | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $package) { throw 'the Store package did not install' }
          "Installed OpenAI.Codex $($package.Version) ($($package.Architecture)) on $env:PROCESSOR_ARCHITECTURE"
          "CANARY_PACKAGE=$($package.Version)" >> $env:GITHUB_ENV
          "CANARY_PACKAGE_DIR=$($package.InstallLocation)" >> $env:GITHUB_ENV

      - name: Read the app's own version and build number
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          $work = Join-Path $env:RUNNER_TEMP 'asar-probe'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Push-Location $work
          node "$env:GITHUB_WORKSPACE/node_modules/@electron/asar/bin/asar.mjs" extract-file (Join-Path $env:CANARY_PACKAGE_DIR 'app\resources\app.asar') package.json
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          Pop-Location
          "The app reports version $($manifest.version), build $($manifest.codexBuildNumber)"
          "CANARY_APP_VERSION=$($manifest.version)" >> $env:GITHUB_ENV
          "CANARY_APP_BUILD=$($manifest.codexBuildNumber)" >> $env:GITHUB_ENV

      # Python may or may not be on this image: the installer offers to install it, which
      # exercises that path on real ARM64 Windows.
      - name: Run the installer
        id: install
        shell: bash
        run: |
          set +e
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 > install.log 2>&1
          code=$?
          cat install.log
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Boot the patched app
        id: boot
        if: steps.install.outputs.exit_code == '0'
        shell: pwsh
        run: |
          $output = & ./scripts/boot-check.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          $output
          $line = ($output -split "`r?`n" | Where-Object { $_ -match '^boot:' } | Select-Object -Last 1)
          $detail = if ($line -match '\((.*)\)') { $Matches[1] } else { $line }
          "status=$(if ($code -eq 0) { 'ok' } else { 'failed' })" >> $env:GITHUB_OUTPUT
          "detail=$detail" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Write the result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.install.outputs.exit_code }}
          BOOT: ${{ steps.boot.outputs.status }}
          BOOT_DETAIL: ${{ steps.boot.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/canary.py result --platform windows-arm64 --log install.log --exit-code "${EXIT_CODE:-1}" \
            --boot "${BOOT:-skipped}" --boot-detail "${BOOT_DETAIL}" --package "${CANARY_PACKAGE}" \
            --app-version "${CANARY_APP_VERSION}" --build "${CANARY_APP_BUILD}" --run-url "${RUN_URL}" --out canary-windows-arm64.json

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-windows-arm64
          path: |
            canary-windows-arm64.json
            install.log

  report:
    needs: [macos, windows-x64, windows-arm64]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: canary-*
          path: results
          merge-multiple: true

      - name: Summarise
        run: |
          ls -la results
          python3 scripts/canary.py summary results/canary-*.json | tee -a "${GITHUB_STEP_SUMMARY}"
          # A canary that cannot pass is the point of the canary: fail the run so it shows.
          python3 - <<'PY'
          import glob, json, sys
          bad = [r["platform"] for r in (json.load(open(p, encoding="utf-8")) for p in glob.glob("results/canary-*.json")) if r["status"] != "pass"]
          missing = {"macos", "windows-x64", "windows-arm64"} - {json.load(open(p, encoding="utf-8"))["platform"] for p in glob.glob("results/canary-*.json")}
          if bad or missing:
              print("not passing:", sorted(bad), "no result:", sorted(missing))
              sys.exit(1)
          PY
