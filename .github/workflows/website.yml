name: Website
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/publish_website.sh'
      - '.github/workflows/website.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: github-pages-source
  cancel-in-progress: false
jobs:
  publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check website JavaScript
        run: node --check website/app.js
      - name: Authenticate source publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Publish static source to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_website.sh
      # GITHUB_TOKEN pushes do not trigger Pages builds automatically.
      - name: Request native Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/${PAGES_REPOSITORY}/pages/builds"
